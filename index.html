<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c0c0c"><title>До встречи</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0c0c;color:#f0f0ed;font-family:Arial,Helvetica,sans-serif;min-height:100vh;min-height:100svh;display:grid;place-items:center}main{width:min(88vw,1100px);animation:appear .9s ease-out}h1{font-size:clamp(32px,12.2vw,150px);font-weight:500;letter-spacing:-.075em;line-height:.95;margin:0 0 clamp(28px,6vw,80px);text-align:center;white-space:nowrap}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #454545;padding-top:clamp(18px,3vw,36px);text-align:center}.unit{position:relative}.unit+.unit{border-left:1px solid #303030}.num{display:block;font-size:clamp(32px,8.8vw,110px);font-weight:400;letter-spacing:-.065em;font-variant-numeric:tabular-nums;line-height:1}.label{display:block;color:#999;font-size:clamp(9px,1.15vw,13px);letter-spacing:.16em;margin-top:16px;text-transform:uppercase}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){main{animation:none}}@media(max-width:400px){.label{letter-spacing:.06em}}</style></head><body><main><h1>ДО ВСТРЕЧИ</h1><div class="timer" role="timer" aria-label="Обратный отсчёт до встречи"><div class="unit"><span class="num" id="d">00</span><span class="label">Дни</span></div><div class="unit"><span class="num" id="h">00</span><span class="label">Часы</span></div><div class="unit"><span class="num" id="m">00</span><span class="label">Минуты</span></div><div class="unit"><span class="num" id="s">00</span><span class="label">Секунды</span></div></div></main><script>const target=Date.parse('2026-11-27T12:30:00+02:00');function tick(){const t=Math.max(0,Math.ceil((target-Date.now())/1000));const values=[Math.floor(t/86400),Math.floor(t/3600)%24,Math.floor(t/60)%60,t%60];['d','h','m','s'].forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'));}tick();setInterval(tick,250);</script></body></html>
